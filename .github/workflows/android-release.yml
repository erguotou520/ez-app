name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-toolbox:
    name: Android toolbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ez-release.jks"
          chmod 600 "$RUNNER_TEMP/ez-release.jks"

      - name: Build APK
        working-directory: android-toolbox
        env:
          SIGN_KEY_FILE: ${{ github.event_name != 'pull_request' && format('{0}/ez-release.jks', runner.temp) || '' }}
          SIGN_KEY_PWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Verify release signature
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose \
            android-toolbox/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ez-android-${{ github.sha }}
          path: android-toolbox/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  input-method:
    name: Input method
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext ninja-build
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;28.0.13004108" "cmake;3.31.6"

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ez-release.jks"
          chmod 600 "$RUNNER_TEMP/ez-release.jks"

      - name: Build APK
        working-directory: android-fcitx5-input-method
        env:
          BUILD_ABI: arm64-v8a
          ECM_DIR: /usr/share/ECM/cmake
          SIGN_KEY_FILE: ${{ github.event_name != 'pull_request' && format('{0}/ez-release.jks', runner.temp) || '' }}
          SIGN_KEY_PWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Verify release signature
        if: github.event_name != 'pull_request'
        run: |
          find android-fcitx5-input-method/app/build/outputs/apk -name '*release*.apk' -print0 \
            | xargs -0 -n1 "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ez-input-method-arm64-${{ github.sha }}
          path: android-fcitx5-input-method/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
