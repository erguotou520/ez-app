name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 统一解析版本号，供下面两个构建 job 和发布 job 复用，避免各 job 各算一套导致对不上。
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.resolve.outputs.version_name }}
      version_code: ${{ steps.resolve.outputs.version_code }}
    steps:
      - name: Resolve version from tag
        id: resolve
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 打 tag（如 v1.2.1）时：versionName 取 1.2.1，versionCode 用
            # major*10000 + minor*100 + patch 派生，保证每次发版单调递增，
            # 用户手机上才能覆盖安装升级。上限 2100000000。
            version_name="${GITHUB_REF_NAME#v}"
            IFS='.' read -r major minor patch <<< "$version_name"
            version_code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          else
            # 非 tag 触发（push main / PR / 手动）：产物只用于验证构建，不参与正式发版。
            version_name="0.0.0-snapshot"
            version_code=1
          fi
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"
          echo "resolved version: $version_name ($version_code)"

  android-toolbox:
    name: Android toolbox
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # 该 action 的默认值是 `tools platform-tools`，但 `tools` 包已被 Google 从 SDK
          # 仓库下架（由 cmdline-tools 取代），sdkmanager 会报
          # "Failed to find package 'tools'" 并以 exit 1 结束整个 action。故只装 platform-tools。
          packages: platform-tools

      # 工具箱的 buildToolsVersion 固定为 35.0.1，setup-android 不会预装它。
      # 显式安装，保证后面用绝对路径调 apksigner 时一定存在。
      - name: Install build-tools
        run: sdkmanager "build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(ANDROID_RELEASE_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(ANDROID_RELEASE_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_RELEASE_KEY_ALIAS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少签名密钥 ${missing[*]}。请在仓库 Settings → Secrets and variables → Actions 中配置后重跑。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ez-release.jks"
          chmod 600 "$RUNNER_TEMP/ez-release.jks"

      - name: Build APK
        working-directory: android-toolbox
        env:
          SIGN_KEY_FILE: ${{ github.event_name != 'pull_request' && format('{0}/ez-release.jks', runner.temp) || '' }}
          SIGN_KEY_PWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease \
              -PezVersionName="${{ needs.resolve-version.outputs.version_name }}" \
              -PezVersionCode="${{ needs.resolve-version.outputs.version_code }}"
          fi

      - name: Verify release signature
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose \
            android-toolbox/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ez-toolbox-apk
          path: android-toolbox/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  input-method:
    name: Input method
    needs: resolve-version
    runs-on: ubuntu-latest
    # native（fcitx5 / libime 等）编译较慢，给个上限避免异常时白占 runner。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # 该 action 的默认值是 `tools platform-tools`，但 `tools` 包已被 Google 从 SDK
          # 仓库下架（由 cmdline-tools 取代），sdkmanager 会报
          # "Failed to find package 'tools'" 并以 exit 1 结束整个 action。故只装 platform-tools。
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # 版本与 android-fcitx5-input-method/build-logic/.../Versions.kt 保持一致，
      # extra-cmake-modules 供 find_package(ECM) 使用。
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext ninja-build
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;28.0.13004108" "cmake;3.31.6"

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(ANDROID_RELEASE_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(ANDROID_RELEASE_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_RELEASE_KEY_ALIAS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少签名密钥 ${missing[*]}。请在仓库 Settings → Secrets and variables → Actions 中配置后重跑。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ez-release.jks"
          chmod 600 "$RUNNER_TEMP/ez-release.jks"

      - name: Build APK
        working-directory: android-fcitx5-input-method
        env:
          BUILD_ABI: arm64-v8a
          ECM_DIR: /usr/share/ECM/cmake
          SIGN_KEY_FILE: ${{ github.event_name != 'pull_request' && format('{0}/ez-release.jks', runner.temp) || '' }}
          SIGN_KEY_PWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease \
              -PezVersionName="${{ needs.resolve-version.outputs.version_name }}" \
              -PezVersionCode="${{ needs.resolve-version.outputs.version_code }}"
          fi

      - name: Verify release signature
        if: github.event_name != 'pull_request'
        run: |
          # -r 避免 find 无结果时仍然调用一次无参数的 apksigner。
          find android-fcitx5-input-method/app/build/outputs/apk -name '*release*.apk' -print0 \
            | xargs -0 -r -n1 "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ez-input-method-apk
          path: android-fcitx5-input-method/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # 打 v* tag 时，把两个 APK 汇总重命名后发布到 GitHub Release。
  # concurrency 的 group 与 macOS 工作流保持一致，让两个 workflow 的发布动作串行，
  # 避免它们同时创建同一个 tag 的 Release 而互相冲突。
  publish:
    name: Publish release
    needs: [resolve-version, android-toolbox, input-method]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: ez-*-apk
          path: apks

      - name: Rename APKs
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.version_name }}"

          toolbox_apk=$(find apks/ez-toolbox-apk -name '*release*.apk' | head -1)
          input_method_apk=$(find apks/ez-input-method-apk -name '*release*.apk' | head -1)
          [ -n "$toolbox_apk" ] || { echo "::error::未找到工具箱的 release APK"; exit 1; }
          [ -n "$input_method_apk" ] || { echo "::error::未找到输入法的 release APK"; exit 1; }

          mv "$toolbox_apk" "apks/拾光工具箱-${version}.apk"
          mv "$input_method_apk" "apks/小企鹅输入法-${version}-arm64-v8a.apk"
          rm -rf apks/ez-toolbox-apk apks/ez-input-method-apk
          ls -la apks/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
